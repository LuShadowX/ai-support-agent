[project]
name = "ai-support-agent"
version = "1.0.0"
description = "AI customer-support agent: answers from your documents (RAG) and takes actions (order lookup, stock check, human handoff)."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.50",
    "chromadb>=0.5",
    "fastembed>=0.4",
    "pypdf>=5.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
